name: spygame
description: "Where am I? — a real-time party game of bluffing and deduction."
publish_to: 'none'
version: 1.0.13+13

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8

  # Backend
  convex_flutter: ^3.0.1
  # Firebase Cloud Messaging — used by the Convex notifications action to
  # wake Android devices for the round-end "Round ended" transition while
  # the app is fully backgrounded. firebase_core is a transitive
  # requirement of firebase_messaging.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Pinned to match the version convex_flutter's pre-built Rust core was
  # compiled against (its caret constraint accepts 2.12.x, which mismatches
  # at runtime and throws a StateError on first use).
  flutter_rust_bridge: 2.11.1

  # State management & code-gen
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^14.6.0

  # Storage & identity
  shared_preferences: ^2.3.3
  uuid: ^4.5.1

  # System integrations
  flutter_local_notifications: ^17.2.4
  share_plus: ^10.1.2
  wakelock_plus: ^1.2.10
  app_links: ^6.3.2
  permission_handler: ^11.3.1

  # UI
  google_fonts: ^6.2.1

  # In-app purchases (RevenueCat). Single SDK for iOS App Store + Google
  # Play, plus receipt validation, restore, and refund propagation. Maps
  # the existing clientToken to RC's appUserID — no auth required.
  purchases_flutter: ^10.0.2

  # Utilities
  collection: ^1.18.0
  meta: ^1.15.0
  timezone: ^0.9.4
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^3.1.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.4
  riverpod_lint: ^2.6.3
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
